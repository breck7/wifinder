<!DOCTYPE html>
<html lang="en">
<body>
<link rel="stylesheet" href=".leaflet.css">
<script src=".leaflet.js"></script>
<script src=".pmtiles.js"></script>
<script src=".protomaps-leaflet.min.js"></script>
<script src=".basemap.pmtiles.js"></script>
<script src=".scrollLibs.js"></script>

<div id="map5" style="height: 500px;"></div>
<script>
 {
    if (!window.maps) window.maps = {}
     const moveToMyLocation = () => {
      if (!navigator.geolocation) return
      navigator.geolocation.getCurrentPosition((position) => {
          const { latitude, longitude } = position.coords
          window.maps.map5.setView([latitude, longitude])
          L.circleMarker([latitude, longitude], {
              fillOpacity: 0.8,
              radius: 20,
              weight: 4
          })
          .addTo(window.maps.map5)
      }, () => {})
    }
  const lat = 37.8
  const long = 4
  if (false){
      moveToMyLocation()
  }
  const zoomLevel = 4
  const hover = '<b>{title}</b><br>{description}'
  const template = {}
  const points = []
  window.maps.map5 = L.map("map5").setView([lat, long], zoomLevel)
  const map = window.maps.map5
  if (!window.__basemapPmtiles) {
    const b64 = window.__BASEMAP_PMTILES_B64
    const bin = atob(b64)
    const bytes = new Uint8Array(bin.length)
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
    const source = {
      getKey: () => "basemap",
      getBytes: async (offset, length) => {
        const slice = bytes.slice(offset, offset + length)
        return { data: slice.buffer.slice(slice.byteOffset, slice.byteOffset + slice.byteLength) }
      }
    }
    window.__basemapPmtiles = new pmtiles.PMTiles(source)
  }
  const layer = protomapsL.leafletLayer({
    url: window.__basemapPmtiles,
    flavor: "dark",
    lang: "en",
    attribution: '<a href="https://protomaps.com">Protomaps</a> © <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
    maxDataZoom: 8,
    maxZoom: 19
  })
  layer.addTo(map)
  points.forEach(point => {
   L.circleMarker([point.lat, point.long], {...template, ...Object.fromEntries(
          Object.entries(point).filter(([key, value]) => value !== null)
      )})
    .addTo(map)
    .bindPopup(new Particle(point).evalTemplateString(hover))
  })
 }
</script>
</body>
</html>
